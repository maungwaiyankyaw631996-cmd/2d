name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          npm ci || npm install

      - name: Build Web App
        run: |
          npx vite build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install & Configure Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK as Artifact (Downloadable from GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: 2D-Ledger-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Automatic GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "2D Ledger Android App v1.0.${{ github.run_number }}"
          body: |
            ## 📱 2D Ledger Android APK Release
            ဒီ Release မှာ ပါဝင်တဲ့ APK ဖိုင်ကို ဒေါင်းလုဒ်ဆွဲပြီး သင့် Android ဖုန်းထဲတွင် တိုက်ရိုက် Install ပြုလုပ်နိုင်ပါသည်။
            
            - **App Name:** 2D Ledger
            - **File:** `2D-Ledger-v1.0.${{ github.run_number }}.apk`
            - **Build Date:** ${{ github.event.head_commit.timestamp }}
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
