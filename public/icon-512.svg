<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091224"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="95" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="6"/>
  <!-- App badge emblem -->
  <circle cx="256" cy="200" r="120" fill="url(#emeraldGrad)" opacity="0.15"/>
  <text x="256" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="140" font-weight="900" fill="url(#emeraldGrad)" text-anchor="middle" letter-spacing="-4">2D</text>
  <!-- Sub label -->
  <rect x="136" y="320" width="240" height="54" rx="27" fill="url(#amberGrad)"/>
  <text x="256" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="1">LEDGER</text>
  <!-- Mini dots -->
  <circle cx="160" cy="420" r="8" fill="#34d399"/>
  <circle cx="256" cy="420" r="8" fill="#fbbf24"/>
  <circle cx="352" cy="420" r="8" fill="#38bdf8"/>
</svg>
